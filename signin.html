<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — LoopIn</title>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <header class="navbar"><a href="index.html" class="logo-container" aria-label="LoopIn home"><span class="logo-icon" aria-hidden="true">↔</span><span class="logo-text">LoopIn</span></a></header>
  <main class="auth-main">
    <section class="auth-card">
      <p class="section-kicker">Welcome back</p>
      <h1>Sign in to LoopIn.</h1>
      <p class="auth-intro">Use your college email to pick up where you left off.</p>
      <form class="auth-form" data-auth-form="signin">
        <div class="form-group"><label for="signin-email">College email</label><input id="signin-email" name="email" type="email" placeholder="you@university.edu" autocomplete="email" required></div>
        <div class="form-group"><label for="signin-password">Password</label><input id="signin-password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="primary-btn" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
    </section>
  </main>
</body>
</html>
