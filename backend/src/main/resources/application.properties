# =======================================================
# LoopIn Core Service (Service 1) Configuration
# =======================================================
spring.application.name=loopin-core-service
server.port=8080

# =======================================================
# H2 In-Memory Database & Spring Data JPA Auto-Configuration
# =======================================================
spring.datasource.url=jdbc:h2:mem:loopindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Auto-Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =======================================================
# Microservice 2 (Trust Verification Service) Endpoint URL
# =======================================================
trust.service.url=http://localhost:8081

# =======================================================
# Logging Configuration
# =======================================================
logging.level.com.loopin=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
