<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — LoopIn</title>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <header class="navbar"><a href="index.html" class="logo-container" aria-label="LoopIn home"><span class="logo-icon" aria-hidden="true">↔</span><span class="logo-text">LoopIn</span></a></header>
  <main class="auth-main">
    <section class="auth-card">
      <p class="section-kicker">Join your campus</p>
      <h1>Make borrowing easier.</h1>
      <p class="auth-intro">Create an account with your college email. It helps keep LoopIn local and trusted.</p>
      <form class="auth-form" data-auth-form="signup">
        <div class="form-group"><label for="signup-name">Your name</label><input id="signup-name" name="name" type="text" placeholder="Pragati" autocomplete="name" required></div>
        <div class="form-group"><label for="signup-email">College email</label><input id="signup-email" name="email" type="email" placeholder="pragati@university.edu" autocomplete="email" required></div>
        <div class="form-group"><label for="signup-password">Create a password</label><input id="signup-password" name="password" type="password" minlength="6" autocomplete="new-password" required></div>
        <button class="primary-btn" type="submit">Create account <span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-switch">Already have an account? <a href="signin.html">Sign in</a></p>
    </section>
  </main>
</body>
</html>
